name: Qualité de la pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Vérifier le lint
        run: npm run lint

      - name: Exécuter les tests
        run: npm test -- --runInBand

      - name: Exporter le bundle iOS JavaScript
        run: npx expo export --platform ios --no-bytecode --output-dir /tmp/reprise-ios-export
